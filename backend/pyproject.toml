[project]
name = "hargapas-backend"
version = "1.0.0"
description = "WorL (WorthGaBang) price-analysis backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "mangum>=0.17,<1",
    "bcrypt>=4,<6",
    "PyJWT>=2.8,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
